- type: entity
  id: MarkerForgeTradeContractBase
  abstract: true
  parent: MarkerBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Markers/cross.rsi

- type: entity
  id: MarkerForgeTradeContractSpawnBase
  abstract: true
  parent: MarkerForgeTradeContractBase
  components:
  - type: Sprite
    layers:
    - state: green

- type: entity
  id: MarkerForgeTradeContractDestinationBase
  abstract: true
  parent: MarkerForgeTradeContractBase
  components:
  - type: Sprite
    layers:
    - state: blue

- type: entity
  id: MarkerForgeTradeContractDangerBase
  abstract: true
  parent: MarkerForgeTradeContractBase
  components:
  - type: Sprite
    layers:
    - state: red

- type: entity
  id: MarkerForgeTradeTestCargoSource
  parent: MarkerForgeTradeContractSpawnBase
  name: "контракт: груз"
  description: "Точка появления груза для Trade-контрактов."
  suffix: Forge, Trade, Contracts, Mapper
  components:
  - type: NcContractSpawnPoint
    id: ForgeTradeTestCargoSource
    groups:
    - ForgeTradeTestCargoSource
    - ForgeTradeTestCargo
    - ForgeTradeContractObjectiveSpawn

- type: entity
  id: MarkerForgeTradeTestDropoff
  parent: MarkerForgeTradeContractDestinationBase
  name: "контракт: приемка"
  description: "Точка доставки груза для proof-маршрута."
  suffix: Forge, Trade, Contracts, Mapper
  components:
  - type: NcContractSpawnPoint
    id: ForgeTradeTestDropoff
    groups:
    - ForgeTradeTestDropoff
    - ForgeTradeContractDropoff

- type: entity
  id: MarkerForgeTradeTestHuntSpawn
  parent: MarkerForgeTradeContractDangerBase
  name: "контракт: охота"
  description: "Точка появления целей охотничьего Trade-контракта."
  suffix: Forge, Trade, Contracts, Mapper
  components:
  - type: NcContractSpawnPoint
    id: ForgeTradeTestHuntSpawn
    groups:
    - ForgeTradeTestHuntSpawn
    - ForgeTradeTestHunt
    - ForgeTradeContractObjectiveSpawn

- type: entity
  id: MarkerForgeTradeTestGhostSpawn
  parent: MarkerForgeTradeContractDangerBase
  name: "контракт: ghost-role"
  description: "Точка появления цели ghost-role Trade-контракта."
  suffix: Forge, Trade, Contracts, Mapper
  components:
  - type: NcContractSpawnPoint
    id: ForgeTradeTestGhostSpawn
    groups:
    - ForgeTradeTestGhostSpawn
    - ForgeTradeTestGhostRole
    - ForgeTradeContractObjectiveSpawn
