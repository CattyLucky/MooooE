# Forge-Change-end

- type: dungeonConfig
  id: ForgeHuntDungeonBase
  layers:
  - !type:PrefabDunGen
    presets:
    # Forge-Change-start: use asymmetric mixed-size layouts instead of repeated square silhouettes.
    - ForgeHuntDungeonScatterLayout
    - ForgeHuntDungeonCrookedSpineLayout
    - ForgeHuntDungeonForkedLayout
    - ForgeHuntDungeonBrokenRingLayout
    - ForgeHuntDungeonLongRuinLayout
    - ForgeHuntDungeonDenseIrregularLayout
    - ForgeHuntDungeonTinyOutpostLayout
    - ForgeHuntDungeonCompactRuinLayout
    - ForgeHuntDungeonTallShaftLayout
    - ForgeHuntDungeonWideScatterLayout
    - ForgeHuntDungeonSparseStepsLayout
    - ForgeHuntDungeonSplitRuinLayout
    # Forge-Change-end

  - !type:CorridorDunGen
    width: 3

  - !type:DungeonEntranceDunGen
    count: 2

  - !type:RoomEntranceDunGen

  # Forge-Change-start: add the richer NF post-generation pass to hunt sites.
  - !type:EntranceFlankDunGen

  - !type:ExternalWindowDunGen

  - !type:WallMountDunGen

  - !type:BoundaryWallDunGen

  - !type:JunctionDunGen
    width: 1

  - !type:JunctionDunGen

  - !type:AutoCablingDunGen

  - !type:CornerClutterDunGen

  - !type:CorridorDecalSkirtingDunGen
    cardinalDecals:
      South: BrickTileWhiteLineS
      East: BrickTileWhiteLineE
      North: BrickTileWhiteLineN
      West: BrickTileWhiteLineW
    cornerDecals:
      SouthEast: BrickTileWhiteCornerSe
      SouthWest: BrickTileWhiteCornerSw
      NorthEast: BrickTileWhiteCornerNe
      NorthWest: BrickTileWhiteCornerNw
    pocketDecals:
      SouthWest: BrickTileWhiteInnerSw
      SouthEast: BrickTileWhiteInnerSe
      NorthWest: BrickTileWhiteInnerNw
      NorthEast: BrickTileWhiteInnerNe
  # Forge-Change-end

- type: dungeonConfig
  id: ForgeHuntDungeonRockOreBase
  layers:
  - !type:PrototypeDunGen
    proto: ForgeHuntDungeonBase

  # Forge-Change-start: add light ore clusters only to rock-walled hunt sites.
  - !type:OreDunGen
    entityMask:
    - WallRock
    entity: WallRockTin
    count: 3
    minGroupSize: 3
    maxGroupSize: 5

  - !type:OreDunGen
    entityMask:
    - WallRock
    entity: WallRockCoal
    count: 2
    minGroupSize: 3
    maxGroupSize: 5

  - !type:OreDunGen
    entityMask:
    - WallRock
    entity: WallRockQuartz
    count: 2
    minGroupSize: 3
    maxGroupSize: 5

  - !type:OreDunGen
    entityMask:
    - WallRock
    entity: WallRockSilver
    count: 1
    minGroupSize: 1
    maxGroupSize: 2

  - !type:OreDunGen
    entityMask:
    - WallRock
    entity: WallRockGold
    count: 1
    minGroupSize: 1
    maxGroupSize: 2
  # Forge-Change-end

- type: dungeonConfig
