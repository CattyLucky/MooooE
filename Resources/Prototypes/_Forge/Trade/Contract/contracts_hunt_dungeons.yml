- type: dungeonPreset
  id: ForgeHuntDungeonLayout
  roomPacks:
  - 0,0,17,17
  - 20,0,37,17
  - 20,20,37,37
  - -20,0,-3,17
  - -20,20,-3,37

- type: dungeonConfig
  id: ForgeHuntDungeonBase
  layers:
  - !type:PrefabDunGen
    presets:
    - ForgeHuntDungeonLayout

  - !type:CorridorDunGen
    width: 3

  - !type:DungeonEntranceDunGen
    count: 1

  - !type:RoomEntranceDunGen

  - !type:BoundaryWallDunGen

  - !type:JunctionDunGen
    width: 1

  - !type:JunctionDunGen

- type: dungeonConfig
  id: ForgeHuntDungeonMineshaft
  data:
    entities:
      Walls: WallRock
      CornerWalls: WallRock
    spawnGroups:
      Entrance: NFBaseAirlock
      Junction: NFBaseAirlock
    tiles:
      FallbackTile: FloorCaveDrought
    whitelists:
      Rooms:
        tags:
        - NFMineshaft
  layers:
  - !type:PrototypeDunGen
    proto: ForgeHuntDungeonBase

